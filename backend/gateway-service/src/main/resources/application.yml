server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/shows/**,/api/inventory/**
          filters:
            - name: Retry
              args:
                retries: 3
                series: SERVER_ERROR
                methods: GET,POST
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - name: Retry
              args:
                retries: 3
                series: SERVER_ERROR
                methods: GET,POST
        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
jwt:
  secret: ${JWT_SECRET:orderflow-dev-secret-please-change-32chars}
